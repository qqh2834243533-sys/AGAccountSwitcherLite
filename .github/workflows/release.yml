name: Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Restore, build and test
        run: |
          dotnet restore AGSwitcher.sln --locked-mode --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build AGSwitcher.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test AGSwitcher.sln -c Release --no-build --no-restore
      - name: Verify SBOM tool and package candidate
        run: |
          $sbom = Join-Path $env:RUNNER_TEMP 'sbom-tool-win-x64.exe'
          $uri = 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe'
          $sha256 = '625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5'
          Invoke-WebRequest -Uri $uri -OutFile $sbom
          if ((Get-FileHash -LiteralPath $sbom -Algorithm SHA256).Hash -ne $sha256) {
            throw 'Unexpected SBOM tool checksum.'
          }
          ./scripts/package.ps1 -SbomTool $sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-candidate
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.spdx.json
            artifacts/*.sbom-validation.json
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14
