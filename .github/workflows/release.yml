name: Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting, lints, and unit tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify SBOM tool and package release candidate
        run: |
          $sbom = Join-Path $env:RUNNER_TEMP 'sbom-tool-win-x64.exe'
          $uri = 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe'
          $sha256 = '625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5'
          Invoke-WebRequest -Uri $uri -OutFile $sbom
          if ((Get-FileHash -LiteralPath $sbom -Algorithm SHA256).Hash -ne $sha256) {
            throw 'Unexpected SBOM tool checksum.'
          }
          ./scripts/package.ps1 -CargoWrapper cargo -SbomTool $sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-candidate
          path: |
            artifacts/ag-account-switcher-lite-*-win-x64.zip
            artifacts/ag-account-switcher-lite-*-win-x64.zip.sha256
            artifacts/ag-account-switcher-lite-*-win-x64.spdx.json
            artifacts/ag-account-switcher-lite-*-win-x64.sbom-validation.json
            CHANGELOG.md
            NOTICE.md
          if-no-files-found: error
          retention-days: 14
