name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Restore and audit direct and transitive NuGet dependencies
        run: dotnet restore AGSwitcher.sln --locked-mode --force-evaluate
      - name: Build and run .NET analyzers
        run: dotnet build AGSwitcher.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Unit and simulation tests
        run: dotnet test AGSwitcher.sln -c Release --no-build --no-restore
      - name: Package Windows x64
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-ci
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
