name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run isolated unit and OS vault fixture tests
        run: cargo test --locked
      - name: Build and package Windows x64 portable archive
        run: ./scripts/package.ps1 -CargoWrapper cargo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-ci
          path: |
            artifacts/ag-account-switcher-lite-*-win-x64.zip
            artifacts/ag-account-switcher-lite-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
